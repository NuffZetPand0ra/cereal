#Frontend routes
root:
    path: /
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: product_index
        permanent: false

product_index:
    path: /products
    controller: App\Controller\ProductController::index
    methods: ['GET']

single_product_create:
    path: /product/create
    controller: App\Controller\ProductController::create
    methods: ['GET']

single_product_show:
    path: /product/{id}
    controller: App\Controller\ProductController::show
    methods: ['GET']

single_product_edit:
    path: /product/{id}/edit
    controller: App\Controller\ProductController::edit
    methods: ['GET']

single_product_delete:
    path: /product/{id}/delete
    controller: App\Controller\ProductController::delete
    methods: ['GET|POST|DELETE']

product_save:
    path: /product/save
    controller: App\Controller\ProductController::save
    methods: ['POST']

manufacturer_index:
    path: /manufacturers
    controller: App\Controller\ManufacturerController::index
    methods: ['GET']

single_manufacturer_create:
    path: /manufacturer/create
    controller: App\Controller\ManufacturerController::create
    methods: ['GET']

single_manufacturer_edit:
    path: /manufacturer/{id}/edit
    controller: App\Controller\ManufacturerController::edit
    methods: ['GET']

manufacturer_save:
    path: /manufacturer/save
    controller: App\Controller\ManufacturerController::save
    methods: ['POST']

single_manufacturer_delete:
    path: /manufacturer/{id}/delete
    controller: App\Controller\ManufacturerController::delete
    methods: ['GET|POST|DELETE']

manufacturer_check_shorthand:
    path: /manufacturer/check-shorthand
    controller: App\Controller\ManufacturerController::checkShorthand
    methods: ['GET']

# Api routes
api_single_product_show:
    path: /api/product/{id}
    controller: App\Controller\ProductApiController::show
    methods: ['GET']
    format: json

api_single_product_update:
    path: /api/product/{id}
    controller: App\Controller\ProductApiController::update
    methods: ['PUT']
    format: json

api_single_product_patch:
    path: /api/product/{id}
    controller: App\Controller\ProductApiController::patch
    methods: ['PATCH']
    format: json

api_single_product_delete:
    path: /api/product/{id}
    controller: App\Controller\ProductApiController::delete
    methods: ['DELETE']
    format: json

api_single_product_create:
    path: /api/product
    controller: App\Controller\ProductApiController::create
    methods: ['POST|PUT']
    format: json

api_list_products:
    path: /api/products
    controller: App\Controller\ProductApiController::list
    methods: ['GET']

api_ai_cereal_draft:
    path: /api/ai/cereal-draft
    controller: App\Controller\ProductController::aiDraft
    methods: ['POST']
    format: json